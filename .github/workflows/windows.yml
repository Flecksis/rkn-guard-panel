name: Панель для Windows
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Проверить версию
        run: |
          $package = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0]
          if ("v$($package.version)" -ne $env:GITHUB_REF_NAME) { throw 'Версия в Cargo.toml отличается от тега' }
      - run: ./build.ps1
      - name: Опубликовать EXE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/rkn-guard-panel.exe --verify-tag --title $env:GITHUB_REF_NAME --notes-from-tag
